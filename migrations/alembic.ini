# Alembic configuration for Akshara migrations
# 
# This file is the entrypoint for the Alembic migration tool.
# Run migrations with:
#   alembic -c migrations/alembic.ini upgrade head
#
# Phase 1: Stubs only — actual migrations start in Phase 2 (PostgreSQL)

[alembic]
# Path to the migrations scripts directory (relative to this file's location)
script_location = migrations

# Path to env.py
# env.py will read DATABASE_URL from environment
prepend_sys_path = ..

# Timezone used in migration file timestamps
timezone = UTC

# Template for migration filenames
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
